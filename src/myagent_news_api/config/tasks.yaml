# config/tasks.yaml

fetch_ai_news:
  description: >
    Today is {date}. Only include stories published on {two_days_ago} or {date}.
    Reject anything older — check the publish date before selecting any story.

    SCOPE: {topic}

    HARD DIVERSITY RULE — the 7 news stories must come from AT LEAST 4 different
    websites. No single website may contribute more than 2 stories. If your searches
    return 5 results from the same site, take the top 2 from that site and find
    the rest elsewhere. This rule exists so readers get a genuine cross-section
    of the AI world, not a dump from one conference page or one aggregator.

    SOURCE PRIORITY ORDER — work through this list top-to-bottom when deciding
    which results to prefer:
      Tier 1 (primary, highest trust): openai.com, anthropic.com,
        deepmind.google, mistral.ai, meta.ai, huggingface.co, arxiv.org
      Tier 2 (strong industry press): techcrunch.com, venturebeat.com,
        theverge.com, wired.com, technologyreview.com
      Tier 3 (community + aggregators): news.ycombinator.com, reddit.com/r/MachineLearning
      Other credible sources are also fine — these tiers are priority guidance,
      not a whitelist.

    SEARCHES — run exactly 3 SerperDevTool calls. Use Serper's date filter
    syntax so results are genuinely recent. Structure the queries like this:

      Search 1 — Model & research releases (Tier 1 sources):
        Query: {topic} new model OR paper OR release after:{two_days_ago}
        Goal: catch primary announcements from labs and arxiv

      Search 2 — Products, agents & frameworks (press sources):
        Query: {topic} AI agent OR framework OR tool OR launch after:{two_days_ago}
        Goal: catch product launches, new frameworks, and tooling news

      Search 3 — Trending & community picks:
        Query: {topic} site:news.ycombinator.com OR site:venturebeat.com
               OR site:technologyreview.com after:{two_days_ago}
        Goal: catch community-vetted stories and long-tail coverage

    After the 3 searches, use ScrapeWebsiteTool to open the full page of any
    candidate article whose snippet is too short to write a proper summary from.
    Do NOT write summaries based only on the search snippet — the summary must
    reflect the actual article content.

    Also call GithubTrendingTool once to fetch today's top trending repository
    and add it as the 8th item. Set its category to "framework" unless it is
    clearly a model (use "model_release") or dataset (use "research_paper").

    SELECTION CRITERIA for the 7 news stories:
      - Must satisfy the diversity rule above (≥4 different domains, ≤2 per domain)
      - Prefer stories with real technical substance: what problem does it solve,
        what is measurably new, what are the numbers
      - Reject pure marketing, funding announcements with no technical detail,
        and listicles ("top 10 AI tools")
      - Prefer variety across categories — try to include at least one
        model_release, one research_paper, and one product_launch or framework

    For each of the 7 news stories output these fields:
      - "title"        : specific, descriptive title max 12 words — reader
                          should know exactly what happened from the title alone
      - "source"       : publication name (e.g. "OpenAI Blog", "TechCrunch",
                          "arXiv", "Hugging Face Blog")
      - "publish_date" : YYYY-MM-DD — must be {two_days_ago} or {date}
      - "summary"      : 4-6 sentences in plain English. Cover: what it is,
                          what problem it solves, what is technically new,
                          why it matters for founders/researchers/engineers.
                          Write the facts directly — never say "the article
                          says" or "according to the source." Just state what
                          happened and why it matters.
      - "url"          : direct article URL (not a search result page)
      - "category"     : model_release | research_paper | framework |
                          product_launch | regulation

    Output: raw JSON array of exactly 8 objects (7 news + 1 GitHub repo),
    all fields filled, no nulls, no markdown, no code fences.

  expected_output: >
    Raw JSON array of 8 objects, all fields filled, no nulls.
    [{"title":"...","source":"...","publish_date":"...","summary":"...","url":"...","category":"..."}]
  agent: news_scout


fetch_related_youtube_videos:
  description: >
    You receive 8 AI topics from fetch_ai_news. For each topic, analyse what
    the story is actually about — the specific model name, technique, or
    framework — then build a targeted YouTube search query from that substance,
    not from the generic topic phrase.

    Run exactly 8 YouTube searches total, one per topic, in order. No repeats,
    no extra searches.

    For each topic:
      1. Identify the core technology or concept (e.g. "Mixture of Experts
         routing", "KV cache quantization", "diffusion language models").
      2. Search YouTube for that specific concept.
      3. Take the first 2 results that are clearly relevant.
      4. If results look unrelated to the actual topic (the story is too new),
         fall back to searching the underlying concept with "explained":
           e.g. "mixture of experts explained", "KV cache explained",
                "diffusion language model explained", "AI agents explained"

    Populate every field from the tool's actual returned metadata.
    If a field is genuinely missing from the tool result, write "Unknown" —
    never invent a title, channel name, or date you cannot verify.
    If a video URL has no usable metadata at all, discard it and search again
    using the fallback strategy above.

    You must return exactly 2 videos per topic, 16 videos total.
    Older videos are fine if they are the best explainer for that technology.

    Fields per video:
      - "title"        : from tool result
      - "url"          : YouTube URL exactly as returned by the tool
      - "channel_name" : from tool result, or "Unknown"
      - "publish_date" : YYYY-MM-DD from tool result, or "Unknown"
      - "description"  : your own 1-sentence summary of what the video covers

    Output: raw JSON object. Key = topic title from fetch_ai_news.
    Value = array of exactly 2 video objects.
    No markdown, no code fences, no nulls.

  expected_output: >
    Raw JSON object keyed by topic title, 2 videos each, no nulls.
    {"Topic Title": [{"title":"...","url":"...","channel_name":"...","publish_date":"...","description":"..."}]}
  agent: youtube_research_scout
  context:
    - fetch_ai_news


generate_final_summary:
  description: >
    Merge fetch_ai_news and fetch_related_youtube_videos into one final report.
    Do NOT call any tools — only synthesise the data already returned by the
    two previous tasks.

    Set "generated_at" to exactly: {date}
    Set "date_range"  to exactly: "Last 48 hours from {two_days_ago} to {date}"

    For each of the 8 topics build one object with these fields:
      - "topic_title"   : specific and descriptive — reader understands the
                          story instantly without reading further
      - "category"      : as set by news_scout
      - "source"        : publication name
      - "publish_date"  : article date
      - "article_url"   : original article link
      - "plain_summary" : 4-6 plain-English sentences — what is new, what
                          problem it solves, why it matters, key technical
                          detail. Write for a founder, researcher, or engineer
                          who has 30 seconds to decide if they care.
      - "key_takeaways" : array of exactly 4 short strings, each a standalone
                          fact or insight a reader can act on or remember
      - "related_links" : [{"label":"Original Article","url":"<article_url>"}]
      - "youtube_videos": the 2 video objects from youtube_research_scout for
                          this topic — copy them exactly, no changes

    All 8 topics must be present. No field may be null or empty.

    Output: one raw JSON object, no markdown, no code fences.

  expected_output: >
    Single raw JSON object:
    {
      "generated_at": "{date}",
      "report_title": "AI Research & Technology Daily Digest",
      "total_topics": 8,
      "date_range": "Last 48 hours from {two_days_ago} to {date}",
      "topics": [...]
    }
  agent: summary_analyst
  context:
    - fetch_ai_news
    - fetch_related_youtube_videos