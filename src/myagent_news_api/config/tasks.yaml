# config/tasks.yaml

fetch_ai_news:
  description: >
    Today is {date}. This report only includes stories first published between
    {two_days_ago} and {date} (last 48 hours). Discard anything older during
    selection — do not include it and then drop it later.

    SCOPE: {topic}. Cover model releases, research papers, new techniques,
    frameworks, and products across the AI ecosystem that fit this topic —
    do not restrict yourself to only searching the literal topic phrase.

    SEARCHES — exactly 2 SerperDevTool calls, no more, to conserve API quota.
    Design each query deliberately instead of reusing a generic phrase:
      1. Research/model-release query: target primary sources such as
         openai.com, deepmind.google, anthropic.com, huggingface.co, arxiv.org.
         Include {date} and terms like "release", "paper", "model" so results
         skew toward primary announcements rather than commentary.
      2. Industry/agent-news query: target tech press and community sources
         such as techcrunch.com, venturebeat.com, theverge.com, wired.com,
         news.ycombinator.com. Include {date} and terms like "AI agent",
         "framework", "launch" so results skew toward product and tooling news.
    You may still pull individual results from other credible domains if they
    surface in these two searches — you are not limited to the domains above,
    they are just query anchors. Do not run a third search under any framing.

    Also call GithubTrendingTool once to get today's top trending repository
    and add it as an 8th item (category "framework" unless it is clearly a
    model or dataset release, in which case use the matching category).

    From the two search results, select the 7 strongest AI stories (plus the
    1 GitHub repo = 8 total). Prioritize:
      - Primary research/engineering substance over PR or marketing content
      - Stories where you can clearly state what technical problem was solved
        and what is genuinely new, not just a product announcement
      - Diversity of sources and categories over near-duplicate stories

    For each of the 7 news items extract:
      - "title"        : clean, specific, readable title (max 12 words)
      - "source"       : publication name
      - "publish_date" : YYYY-MM-DD, must fall within the last 48 hours
      - "summary"      : plain-English mini-blog-post explaining what is new,
                          why it matters, and the key technical details.
                          State the facts directly — do not write "this
                          article says" / "according to the source" / similar
                          meta-references. Just state what happened.
      - "url"          : direct article link
      - "category"     : model_release | research_paper | framework |
                          product_launch | regulation

    Output: raw JSON array of exactly 8 objects, all fields filled, no nulls,
    no markdown, no code fences.

  expected_output: >
    Raw JSON array of 8 objects, all fields filled, no nulls.
    [{"title":"...","source":"...","publish_date":"...","summary":"...","url":"...","category":"..."}]
  agent: news_scout


fetch_related_youtube_videos:
  description: >
    You receive 8 AI topics from fetch_ai_news. For each topic, first work out
    what it is actually about (e.g. a specific model, technique, or framework
    name), then build a specific YouTube search query from that — not the
    generic phrase "AI agents" for every topic.

    Run exactly 8 YouTube searches total, one per topic, in sequence. Do not
    run extra searches and do not repeat a topic.

    For each topic:
      1. Search YouTube using a query built from the topic's actual subject.
      2. Take the first 2 relevant URLs returned.
      3. If the topic is too new and results look unrelated, fall back to
         searching the underlying core technology instead (e.g. "Mixture of
         Experts explained", "RAG explained").

    For each video, populate fields from the tool's actual result metadata
    whenever it is available. Only if a specific field genuinely is not
    returned by the tool, use the literal string "Unknown" for that field —
    do not invent a specific channel name, title, or date that you cannot
    verify from the tool output. Never leave a field null or empty.

    You must return exactly 2 videos per topic. Older videos are fine as long
    as they are relevant, high-quality explainers of the core technology.

    Fields per video:
      - "title"        : video title from the tool result
      - "url"          : YouTube URL exactly as returned by the tool
      - "channel_name" : channel name from the tool result, or "Unknown"
      - "publish_date" : YYYY-MM-DD from the tool result, or "Unknown"
      - "description"  : 1 sentence, in your own words, on what the video covers

    Output: raw JSON object. Key = topic title. Value = array of 2 video
    objects. No markdown, no code fences.

  expected_output: >
    Raw JSON object keyed by topic title, 2 videos each, no nulls.
    {"Topic Title": [{"title":"...","url":"...","channel_name":"...","publish_date":"...","description":"..."}]}
  agent: youtube_research_scout
  context:
    - fetch_ai_news


generate_final_summary:
  description: >
    Merge fetch_ai_news and fetch_related_youtube_videos into one final
    report. Do NOT call any tools — only synthesize data you already have.

    Set "generated_at" to exactly: {date}
    Set "date_range" to: "Last 48 hours from {two_days_ago} to {date}"

    For each of the 8 topics, build:
      - "topic_title"   : a specific, descriptive title (not a generic label)
                          — a reader should understand what the story is
                          about from the title alone, without reading further
      - "category"      : from news_scout
      - "source"        : publication name
      - "publish_date"  : article date
      - "article_url"   : original link
      - "plain_summary" : plain-English mini-blog-post covering what is new,
                          why it matters, and the key related details
      - "key_takeaways" : array of 4 short strings
      - "related_links" : [{"label":"Original Article","url":"..."}]
      - "youtube_videos": the 2 video objects for this topic from
                          youtube_research_scout

    Output: one raw JSON object. No markdown, no code fences, no nulls.

  expected_output: >
    Single raw JSON object:
    {
      "generated_at": "{date}",
      "report_title": "AI Research & Technology Daily Digest",
      "total_topics": 8,
      "date_range": "Last 48 hours from {two_days_ago} to {date}",
      "topics": [...]
    }
  agent: summary_analyst
  context:
    - fetch_ai_news
    - fetch_related_youtube_videos