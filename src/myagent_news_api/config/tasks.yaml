# config/tasks.yaml

fetch_ai_news:
  description: >
    Today is {date}. Only include articles published after {two_days_ago}.

    Use SerperDevTool to run two search:
      with the date {date}
      make good qurey 

    And for more accurate result you can use other tools also for best result you have freedom to take best news form source so it is helpful for founders and researchers and engineers also 
    sources should be like openai, deepmind.google, huggingface, techcrunch, venturebeat, theverge, wired, hackernews,antropic. and so on you have fexbility to find from other sources so not just see this side only see other also and give most revolutionary and impactful news related to AI agents and analyze the news properly and give proper news related to AI agents not just search AI agents and give any news. try to find trending news on internet and 
    From that TWO search result pick the top 7 most relevant AI stories.
    also see blog and new methods but listen avoid marketing we need research and what problem they solve this type of nesw 
    DO NOT run multiple searches — two search only to save API quota.

    IMPORTANT : do not say like this THis Article Say give this  directly  what article say okay 

    Use GithubTrendingTool to fetch today's top trending repository. and add it to in that 8 topics so 7 + one gitrepo 8 
    For each story extract:
      - "title"        : clean readable title (max 12 words)
      - "source"       : publication name
      - "publish_date" : YYYY-MM-DD (skip if older than {two_days_ago})
      - "summary"      :  what is new and why it matters and all related key details in  plain-English sentences like mini blog post
      - "url"          : direct article link
      - "category"     : model_release | research_paper | framework | product_launch | regulation

      
    Output: raw JSON array of 8 objects. No markdown, no code fences.

    

  expected_output: >
    Raw JSON array of 8 objects, all fields filled, no nulls.
    [{"title":"...","source":"...","publish_date":"...","summary":"...","url":"...","category":"..."}]
  agent: news_scout


fetch_related_youtube_videos:
  description: >
    You have 8 AI topics from fetch_ai_news.so analyse that topic and make qurey for youtube search to find videos related to that topic.for example in ariticle there is information about mamba model so seach it and give video links but in more inforamtion seach so we get good result.

    IMPORTANT — DO THIS IN ONE SINGLE PASS:
    Run exactly 8 YouTube searches total (one per topic) back-to-back without
    stopping to think between searches. Do NOT make extra searches.
    Do NOT re-search the same topic twice.make sure you find proper videos of topic like Ai gents then analyze topic properly and givw proper video related to Ai agents not just search Ai agents and give any video. Analyze topic properly and give proper video related to topic.

    For each topic:
      1. Search YouTube using the topic. first analyse that topic and make search query for youtube.
      2. Take the first 2 URLs returned
      3. If the topic is too new and results seem unrelated, instead search
         the core technology (e.g. "RAG explained", "mixture of experts explained")

    For each video fill ALL fields — if title/channel/date are unknown,
    write your best inference from the URL and topic context. Never leave null.
    you MUST return 2 videos per topic. and old videos are fine as long as they are relevant and high-quality explainers of the core technology.
    Fields per video:
      - "title"        : video title (infer from topic if unknown)
      - "url"          : YouTube URL exactly as returned by tool
      - "channel_name" : channel name (infer if unknown, e.g. "AI Research Channel")
      - "publish_date" : YYYY-MM-DD or "unknown"
      - "description"  : 1 sentence about what the video covers

    Output: raw JSON object. Key = topic title. Value = array of 2 video objects.
    No markdown, no code fences.

  expected_output: >
    Raw JSON object keyed by topic title, 2 videos each, no nulls.
    {"Topic Title": [{"title":"...","url":"...","channel_name":"...","publish_date":"...","description":"..."}]}
  agent: youtube_research_scout
  context:
    - fetch_ai_news


generate_final_summary:
  description: >
    Merge fetch_ai_news and fetch_related_youtube_videos into one final report.
    Do NOT call any tools — just synthesize the data you already have.

    Set "generated_at" to exactly: {date}
    Set "date_range" to: "Last 48 hours from {two_days_ago} to {date}"

    For each of the 8 topics build:
      - "topic_title"   : clean title no comman or general  tile give detail so when user read that it understant instancly
      - "category"      : from news_scout
      - "source"        : publication name
      - "publish_date"  : article date
      - "article_url"   : original link
      - "plain_summary" :  what is new and why it matters and all related key details in  plain-English sentences like mini blog post
      - "key_takeaways" : array of 4 short strings
      - "related_links" : [{"label":"Original Article","url":"..."}]
      - "youtube_videos": 2 video objects from youtube_research_scout

    Output: one raw JSON object. No markdown, no code fences, no nulls.

  expected_output: >
    Single raw JSON object:
    {
      "generated_at": "{date}",
      "report_title": "AI Research & Technology Daily Digest",
      "total_topics": 8,
      "date_range": "Last 48 hours from {two_days_ago} to {date}",
      "topics": [...]
    }
  agent: summary_analyst
  context:
    - fetch_ai_news
    - fetch_related_youtube_videos
